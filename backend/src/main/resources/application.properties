spring.application.name=backend
spring.profiles.default=dev

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

management.endpoints.web.exposure.include=health,info

geosoa.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500

geosoa.igp.url=https://ide.igp.gob.pe/arcgis/rest/services/monitoreocensis
geosoa.igp.connect-timeout=5s
geosoa.igp.read-timeout=10s

geosoa.senamhi.url=https://idesep.senamhi.gob.pe/geoserver
geosoa.senamhi.connect-timeout=5s
geosoa.senamhi.read-timeout=15s
geosoa.senamhi.capa=ANUAL

geosoa.inei.url=https://geoespacial.inei.gob.pe/geoserver/Interoperabilidad
geosoa.inei.connect-timeout=5s
geosoa.inei.read-timeout=20s

geosoa.cache.igp-ttl=1m
geosoa.cache.senamhi-ttl=12h
geosoa.cache.inei-ttl=24h
geosoa.cache.tamano-maximo=1000

resilience4j.retry.configs.default.max-attempts=3
resilience4j.retry.configs.default.wait-duration=500ms
resilience4j.retry.configs.default.retry-exceptions=com.geosoa.backend.shared.FuenteNoDisponibleException
resilience4j.retry.instances.igp.base-config=default
resilience4j.retry.instances.senamhi.base-config=default
resilience4j.retry.instances.inei.base-config=default

resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=6
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.configs.default.record-exceptions=com.geosoa.backend.shared.FuenteNoDisponibleException
resilience4j.circuitbreaker.instances.igp.base-config=default
resilience4j.circuitbreaker.instances.senamhi.base-config=default
resilience4j.circuitbreaker.instances.inei.base-config=default
