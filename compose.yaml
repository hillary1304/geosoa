services:
  mysql:
    image: mysql:8.4
    container_name: geosoa-mysql
    restart: "no"
    environment:
      MYSQL_DATABASE: geosoa
      MYSQL_USER: soauser
      MYSQL_PASSWORD: soapass
      MYSQL_ROOT_PASSWORD: soapass
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
  mysql-territorio:
    image: mysql:8.4
    container_name: geosoa-mysql-territorio
    restart: "no"
    environment:
      MYSQL_DATABASE: geosoa_territorio
      MYSQL_USER: territorio
      MYSQL_PASSWORD: territorio-local
      MYSQL_ROOT_PASSWORD: territorio-root-local
    ports:
      - "3308:3306"
    volumes:
      - mysql-territorio-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
  mysql-territorio-data:
