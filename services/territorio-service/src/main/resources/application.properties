spring.application.name=territorio-service
server.port=${SERVER_PORT:8083}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3308/geosoa_territorio}
spring.datasource.username=${DB_USERNAME:territorio}
spring.datasource.password=${DB_PASSWORD:territorio-local}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

geosoa.inei.url=${INEI_URL:https://geoespacial.inei.gob.pe/geoserver/Interoperabilidad}
geosoa.inei.connect-timeout=${INEI_CONNECT_TIMEOUT:5s}
geosoa.inei.read-timeout=${INEI_READ_TIMEOUT:20s}

resilience4j.retry.configs.default.max-attempts=2
resilience4j.retry.configs.default.wait-duration=300ms
resilience4j.retry.configs.default.retry-exceptions=com.geosoa.territorio.shared.FuenteNoDisponibleException
resilience4j.retry.instances.inei.base-config=default
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=6
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.configs.default.record-exceptions=com.geosoa.territorio.shared.FuenteNoDisponibleException
resilience4j.circuitbreaker.instances.inei.base-config=default
management.health.circuitbreakers.enabled=true
