spring.application.name=sismos-service
spring.profiles.default=dev
server.port=${SERVER_PORT:8081}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.url=${SISMOS_DB_URL:jdbc:mysql://localhost:3307/geosoa_sismos}
spring.datasource.username=${SISMOS_DB_USER:sismos}
spring.datasource.password=${SISMOS_DB_PASSWORD:sismos-local}
spring.datasource.hikari.connection-timeout=5000
management.endpoints.web.exposure.include=health,info
management.health.circuitbreakers.enabled=true
geosoa.igp.url=https://ide.igp.gob.pe/arcgis/rest/services/monitoreocensis
geosoa.igp.connect-timeout=5s
geosoa.igp.read-timeout=10s
geosoa.cache.igp-ttl=1m
geosoa.cache.senamhi-ttl=12h
geosoa.cache.inei-ttl=24h
geosoa.cache.tamano-maximo=1000
geosoa.sincronizacion.habilitada=${SISMOS_SINCRONIZACION_HABILITADA:true}
geosoa.sincronizacion.intervalo=5m
geosoa.sincronizacion.retraso-inicial=10s
geosoa.sincronizacion.dias=7
resilience4j.retry.configs.default.max-attempts=3
resilience4j.retry.configs.default.wait-duration=500ms
resilience4j.retry.configs.default.retry-exceptions=com.geosoa.sismos.shared.FuenteNoDisponibleException
resilience4j.retry.instances.igp.base-config=default
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=6
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.configs.default.record-exceptions=com.geosoa.sismos.shared.FuenteNoDisponibleException
resilience4j.circuitbreaker.instances.igp.base-config=default
resilience4j.circuitbreaker.configs.default.register-health-indicator=true
resilience4j.circuitbreaker.configs.default.allow-health-indicator-to-fail=false
