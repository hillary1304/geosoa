spring.application.name=consulta-service
server.port=${SERVER_PORT:8084}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

geosoa.servicios.sismos-url=${SISMOS_URL:http://localhost:8081}
geosoa.servicios.meteorologia-url=${METEOROLOGIA_URL:http://localhost:8082}
geosoa.servicios.territorio-url=${TERRITORIO_URL:http://localhost:8083}
geosoa.servicios.connect-timeout=${SERVICIOS_CONNECT_TIMEOUT:500ms}
geosoa.servicios.read-timeout=${SERVICIOS_READ_TIMEOUT:3s}
geosoa.servicios.plazo-evento=${SERVICIOS_PLAZO_EVENTO:10s}
