spring.application.name=meteorologia-service
server.port=${SERVER_PORT:8082}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

geosoa.senamhi.url=${SENAMHI_URL:https://idesep.senamhi.gob.pe/geoserver}
geosoa.senamhi.connect-timeout=${SENAMHI_CONNECT_TIMEOUT:5s}
geosoa.senamhi.read-timeout=${SENAMHI_READ_TIMEOUT:15s}
geosoa.senamhi.capa=${SENAMHI_CAPA:ANUAL}

resilience4j.retry.configs.default.max-attempts=2
resilience4j.retry.configs.default.wait-duration=300ms
resilience4j.retry.configs.default.retry-exceptions=com.geosoa.meteorologia.shared.FuenteNoDisponibleException
resilience4j.retry.instances.senamhi.base-config=default

resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=6
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.configs.default.record-exceptions=com.geosoa.meteorologia.shared.FuenteNoDisponibleException
resilience4j.circuitbreaker.instances.senamhi.base-config=default
management.health.circuitbreakers.enabled=true
